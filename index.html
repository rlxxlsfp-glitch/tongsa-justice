<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1e2b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>통합사회2 · 사회 정의와 불평등</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --grid:rgba(30,43,79,.06); --paper:#ffffff; --ink:#1e2b4f; --sub:#5a6580;
  --line:#d9dfea; --accent:#2c4bb0; --hl:#ffe45c; --hl-ink:#1e2b4f; --pink:#e9407e;
  --pen:#1f8a55; --ok:#1f8a55; --ok-bg:#e3f5ec; --bad:#c9364a; --bad-bg:#fde8ec; --chip:#e6eaf2;
  --box:#f6f8fc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131826; --grid:rgba(200,210,240,.05); --paper:#1b2133; --ink:#e7eaf3; --sub:#9aa3bb;
    --line:#2d3550; --accent:#8ea8ff; --hl:rgba(255,220,70,.32); --hl-ink:#fff6c8; --pink:#ff7aa8;
    --pen:#5fd39a; --ok:#5fd39a; --ok-bg:rgba(95,211,154,.14); --bad:#ff7d8e; --bad-bg:rgba(255,125,142,.14);
    --chip:#252c42; --box:#20273b;
  }
}
:root[data-theme="dark"]{
  --bg:#131826; --grid:rgba(200,210,240,.05); --paper:#1b2133; --ink:#e7eaf3; --sub:#9aa3bb;
  --line:#2d3550; --accent:#8ea8ff; --hl:rgba(255,220,70,.32); --hl-ink:#fff6c8; --pink:#ff7aa8;
  --pen:#5fd39a; --ok:#5fd39a; --ok-bg:rgba(95,211,154,.14); --bad:#ff7d8e; --bad-bg:rgba(255,125,142,.14);
  --chip:#252c42; --box:#20273b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15.5px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
header h1 small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.pen{font-family:"Nanum Pen Script",cursive;color:var(--pen);font-size:1.25em;line-height:1.2}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:12px 4px 13px;font-size:14px;color:var(--sub);font-weight:500}
nav.tabs button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.toggle{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.toggle.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* concept */
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.sec>button{width:100%;text-align:left;background:none;border:0;padding:16px 16px 14px;display:flex;gap:12px;align-items:flex-start}
.sec .no{flex:none;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.sec .tt{flex:1}
.sec .tt b{display:block;font-size:16.5px}
.sec .tt span{font-size:13px;color:var(--sub)}
.sec .ar{flex:none;color:var(--sub);transition:transform .2s}
.sec.open .ar{transform:rotate(90deg)}
.body{display:none;padding:0 16px 18px}
.sec.open .body{display:block}
.body h3{font-size:15.5px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.body h4{font-size:14.5px;margin:16px 0 6px;color:var(--accent)}
.body p{margin:6px 0}
.body ul{margin:6px 0;padding-left:20px}
.body li{margin:3px 0}
.k{background:linear-gradient(transparent 55%,var(--hl) 55%);color:var(--hl-ink);font-weight:700;padding:0 1px;border-radius:2px}
:root[data-theme="dark"] .k{color:var(--ink)}
.star{color:var(--pink);font-weight:700}
.note{font-family:"Nanum Pen Script",cursive;color:var(--pen);font-size:19px;line-height:1.3;display:block;margin:4px 0 8px}
.tip{background:var(--box);border-left:3px solid var(--pink);padding:10px 12px;border-radius:0 8px 8px 0;margin:10px 0;font-size:14.5px}
.src{background:var(--box);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px;color:var(--sub)}
.src cite{display:block;text-align:right;font-style:normal;font-size:12.5px;margin-top:4px}
.tbl{overflow-x:auto;margin:8px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14px;line-height:1.55}
th,td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
th{background:var(--chip);font-weight:700;white-space:nowrap}
.blank .k{color:transparent;background:var(--chip);border-bottom:2px dashed var(--sub);cursor:pointer}
.blank .k.show{color:var(--hl-ink);background:linear-gradient(transparent 55%,var(--hl) 55%);border-bottom:0}
.blankinfo{font-size:13px;color:var(--sub);margin:12px 2px 0}

/* quiz */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:14px 0}
.card h2{font-size:17px;margin:0 0 4px}
.muted{color:var(--sub);font-size:13.5px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.lv{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;text-align:left}
.lv b{display:block;font-size:16px}
.lv span{font-size:12.5px;color:var(--sub);line-height:1.4;display:block;margin-top:2px}
.lv.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lv.wide{grid-column:1/-1}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--pink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{display:block;width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
:root[data-theme="dark"] .go{color:#10152a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .go{color:#10152a}}
.go.ghost{background:none;color:var(--accent);border:1.5px solid var(--accent)}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-top:14px}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;background:var(--chip);color:var(--sub);margin-right:4px}
.stem{font-size:16.5px;font-weight:700;line-height:1.6;margin:10px 0}
.psg{background:var(--box);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.psg p{margin:4px 0}
.psg table{min-width:0;font-size:14px;background:var(--paper)}
.bogi{border:1.5px solid var(--ink);border-radius:10px;padding:14px 14px 10px;margin:14px 0;position:relative;font-size:14.5px}
.bogi::before{content:"보기";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 10px;font-weight:700;font-size:13px}
.bogi div{display:flex;gap:8px;margin:4px 0}
.bogi div b{flex:none}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin:8px 0;line-height:1.55}
.opt .n{flex:none;font-weight:700;color:var(--sub)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .n{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .n{color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.exp{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;background:var(--box);border:1px solid var(--line)}
.exp .res{font-weight:700;margin-bottom:4px}
.exp .res.o{color:var(--ok)} .exp .res.x{color:var(--bad)}
.score{font-size:44px;font-weight:700;line-height:1.1}
.wl{border-top:1px solid var(--line);padding:12px 0;font-size:14.5px}
.wl .a{color:var(--ok);font-weight:500;margin-top:4px}
.empty{text-align:center;padding:30px 10px;color:var(--sub)}
.row{display:flex;gap:8px}
.row .go{flex:1}
.chrow{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chrow::-webkit-scrollbar{display:none}
.chrow .chip{white-space:nowrap;flex:none}
.card .chrow{flex-wrap:wrap;overflow:visible;padding-top:8px}
.chhead{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 4px}
.chhead .tt b{display:block;font-size:17px}
.chhead .tt span{font-size:13px;color:var(--sub)}
.go:disabled{opacity:.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="in">
  <h1>사회 정의와 불평등<small>통합사회2 · 개념완성·학교 프린트 기반</small></h1>
  <button id="blankBtn" class="toggle" hidden>빈칸 모드</button>
</div></header>
<main class="wrap" id="app"></main>
<nav class="tabs"><div class="in">
  <button data-tab="concept">개념 정리</button>
  <button data-tab="quiz">문제 풀기</button>
  <button data-tab="wrong">오답 노트</button>
</div></nav>

<script>
/* ============ 개념 정리 ============ */
const K = s => `<b class="k">${s}</b>`;
const S = '<span class="star">★</span>';
const SECTIONS = [
{t:'정의의 의미와 필요성', s:'공자·맹자·벤담 / 플라톤 / 아리스토텔레스', h:`
<h3>정의의 의미</h3>
<ul>
<li>개인이 지켜야 할 올바른 ${K('도리')}</li>
<li>사회를 구성하고 유지하는 ${K('공정한')} 도리</li>
<li>${S} 각자에게 각자의 ${K('몫')}을 주는 것 → 동일한 경우는 ${K('동등')}하게, 다른 것은 ${K('다르게')} 대우</li>
<li>개인들 사이에서 발생하는 ${K('갈등')}을 해결하는 원칙과 기준</li>
<li>개인이나 사회가 추구해야 할 기본적이고 핵심적인 덕목</li>
</ul>
<div class="tbl"><table>
<tr><th>공자</th><td>천하의 바른 ${K('정도')}(正道)를 이루는 것</td></tr>
<tr><th>맹자</th><td>정의를 ${K('의로움(義)')}으로 표현</td></tr>
<tr><th>벤담</th><td>${K('최대 다수의 최대 행복')}</td></tr>
</table></div>

<h3>플라톤</h3>
<div class="src">정의는 각자가 자기 성향에 가장 맞는 국가와 관련된 일 한 가지에 종사하며 타인에게 참견하지 않는 것이다. …어떤 사람이 자격도 없으면서 통치자 계층으로 옮기거나, 한 사람이 모든 일을 동시에 하려 한다면 국가는 파멸될 것이다.<cite>플라톤, 『국가』</cite></div>
<h4>① 영혼 삼분설</h4>
<div class="tbl"><table>
<tr><th>영혼</th><th>설명</th><th>덕</th></tr>
<tr><td>${K('이성')} (머리)</td><td>참으로 좋은 것을 배우고 헤아림</td><td>${K('지혜')}</td></tr>
<tr><td>${K('기개')} (가슴)</td><td>나쁜 것을 볼 때 격정을 느낌</td><td>${K('용기')}</td></tr>
<tr><td>${K('욕구')} (배)</td><td>육체적 만족·쾌락을 탐함</td><td>${K('절제')}</td></tr>
</table></div>
<p>영혼의 정의: ${K('이성')}이 지혜의 덕으로 기개와 욕구를 잘 다스려 영혼이 ${K('조화')}를 이루는 상태</p>
<h4>② 국가론 (이상 국가)</h4>
<div class="tbl"><table>
<tr><th>계층</th><th>역할</th><th>덕</th></tr>
<tr><td>${K('통치자')}</td><td>국가에게 최고로 좋은 것이 무엇인지 인식</td><td>${K('지혜')}, ${K('절제')}</td></tr>
<tr><td>${K('방위자')}(수호자)</td><td>외적과 싸워 국민 수호, 평화와 질서 유지</td><td>${K('용기')}, ${K('절제')}</td></tr>
<tr><td>${K('생산자')}</td><td>지도자에게 복종, 정치에 참여하지 않음</td><td>${K('절제')}</td></tr>
</table></div>
<span class="note">절제는 세 계층 모두에게! / 방위자 ≠ 군인X</span>
<ul>
<li>지혜의 덕을 갖춘 ${K('철학자')}가 통치하거나 현재 통치자들이 ${K('철학')}을 해야 이상 국가 실현 (철인 정치)</li>
<li>${S} 국가의 정의: 세 계층이 각자 직분을 충실히 수행하고 <u>서로의 일을 넘보지 않는</u> ${K('조화')}로운 상태 → 능력과 소질에 따른 철저한 ${K('분업')} 강조</li>
<li>${S} ${K('국가')}를 인간 ${K('영혼')}이 확대된 것으로 봄 → 국가의 정의도 영혼의 정의와 같은 방식(세 부분의 조화)으로 실현</li>
</ul>

<h3>아리스토텔레스</h3>
<div class="tbl"><table>
<tr><th>일반적(보편적) 정의</th><td>공익 실현을 위한 ${K('법')}을 준수하는 것 (= ${K('준법')})</td></tr>
<tr><th rowspan="3">부분적(특수적) 정의</th><td>① ${K('분배')}적 정의 (${K('기하학적')} 비례): 각자의 <b>가치</b>에 따라 몫을 분배 → 일한 만큼!</td></tr>
<tr><td>② ${K('교정')}적 정의 (${K('산술적')} 비례): 손해·이익에서 동등하지 않은 것을 바로잡음 → 눈에는 눈, 이에는 이</td></tr>
<tr><td>③ ${K('교환')}적 정의: 교환의 결과를 공정하게 → 노동과 재화의 교환을 공정하게</td></tr>
</table></div>
<div class="tip">${S} 분배적 = <b>기하학적</b> 비례, 교정적 = <b>산술적</b> 비례. 서로 바꿔 내는 함정 자주 나옴!</div>

<h3>정의의 필요성</h3>
<ol>
<li>개인의 권리와 의무 보장: ${K('기본권')} 보장</li>
<li>공동체의 성과와 부담을 공정하게 ${K('분배')}하는 기준</li>
<li>개인선과 공동선의 조화 → 사회적 ${K('갈등')} 최소화, 사회 통합
 <ul><li>${K('개인선')}: 존엄한 인간의 가치, 개인의 행복 추구와 ${K('자아실현')} 중시</li>
 <li>${K('공동선')}: 공동체의 가치·전통에 따라 구성원의 자아실현·인격 완성 추구, 개인 이익보다 공동의 이익 중시</li></ul></li>
<li>개인·집단 간 갈등과 분쟁을 조정하여 사회 문제 해결</li>
<li>옳고 그름의 판단 기준 제공</li>
</ol>`},

{t:'분배적 정의와 교정적 정의', s:'업적·능력·필요 / 칸트·베카리아·벤담', h:`
<h3>분배적 정의</h3>
<p>${K('분배')}적 정의: 개인 또는 집단 사이에 사회적·경제적 자원을 분배하는 데 있어서의 공정함</p>

<h4>① ${K('업적')}에 따른 분배</h4>
<span class="note">업적 = 성과, 실제로 이룬 결과</span>
<ul>
<li>의미: 목적 달성에 이바지한 성과와 실적 정도에 따른 분배. ${S} <b>기회의 평등</b>이 실현된 상태에서 자유롭게 경쟁하여 ${K('성과')}에 따라 보상</li>
<li>업적은 능력을 바탕으로 하지만, <u>능력이 있다고 다 업적을 내는 것은 아님</u></li>
<li>성별·건강·재산 등 조건이 달라 기회에 차이 → ${K('기회')}의 평등을 실현한 상태에서 경쟁해야 정의로움</li>
<li>예: 성과급제, 성적 우수 장학금, 성과 연봉제</li>
<li>장점: ${K('성취동기')}를 높이고 창의성·잠재력 개발 자극 / 새 문화 창출, 사회적 부 증진 / 측정·평가가 쉬워 ${K('수량화')}에 용이 <span class="pen">(객관화, 정량화 가능)</span></li>
<li>단점: 업적 향상을 위한 ${K('지나친 경쟁')}과 부작용 / 기회의 평등이 보장되지 않으면 약자에게 불리 / 서로 ${K('다른 종류')}의 업적의 양과 질을 ${K('비교')}하기 어려움</li>
</ul>

<h4>② ${K('능력')}에 따른 분배</h4>
<span class="note">능력 = 잠재력, 자질 (업적X)</span>
<ul>
<li>의미: 목적 달성에 필요한 전문적 지식과 자질에 따른 분배, ${K('능력')}이 뛰어난 사람에게 더 많은 보상</li>
<li>능력: 일을 감당할 수 있는 힘(잠재력) / 뛰어난 경영 능력 → 경영자, 뛰어난 치료 능력 → 의사</li>
<li>예: 입시 특기자 전형, 능력 중심 채용(블라인드 심사), 자격증 우대</li>
<li>장점: ${K('성취동기')}를 높여 사회 발전 기여 / 능력을 마음껏 발휘해 높은 업적</li>
<li>단점: ${S} 능력 중 일부가 ${K('선천적')}·${K('우연적')}으로 결정된다는 점을 고려하지 않아 약자의 ${K('소외감')} 유발, 사회 ${K('불평등')} 심화 / 능력에 대한 ${K('평가 기준')}을 정하기 어려움 (결과로 나타나지 않으면 확인 불가)</li>
</ul>

<h4>③ ${K('필요')}에 따른 분배</h4>
<ul>
<li>의미: 의식주 등 인간의 ${K('기본적 욕구')}를 충족하기 위한 우선순위에 따라 분배. ${S} 약자 보호를 위해 기회의 평등을 넘어 <b>${K('결과의 평등')}</b>을 추구</li>
<li>결과의 평등: 능력·배경 등이 불리한 사람에게 다양한 혜택을 제공해 모든 사람이 인간다운 삶을 살 수 있게 하는 것</li>
<li>예: 기초 생활 수급비, 가정 형편이 어려운 학생 장학금, 장애인 버스 요금 지원</li>
<li>장점: ${K('복지 제도')}와 ${K('사회적 안전망')} 마련 / 불평등 개선 → 경제 ${K('안정')}</li>
<li>단점: 성취동기·창의성 저하 → 경제적 비효율 / 가치 있는 재화는 ${K('한정')}되어 있어 모든 필요 충족 <b>불가</b> (재화: 돈, 명예, 권력 등)</li>
</ul>

<h3>교정적 정의</h3>
<ul>
<li>${K('교정적')} 정의: 개인이나 집단에 입힌 손해에 관한 <b>처벌과 배상</b>의 공정함</li>
<li>주로 국가의 법 집행에 따른 처벌로 불법 행위·부정의를 바로잡아 실현</li>
<li>실현되지 않으면 범죄가 퍼져 ${K('사회적 혼란')} 발생</li>
</ul>
<div class="tbl"><table>
<tr><th>함무라비 법전</th><td>눈에는 눈, 이에는 이 → ${K('응보주의')}</td></tr>
<tr><th>칸트 (${K('응보주의')})</th><td>처벌의 본질 = 범죄에 대한 <b>응당한 보복</b>, 살인자는 사형 (사형제 찬성). 처벌은 다른 선을 증진하는 <u>수단이 되어선 안 되고</u>, 범죄를 저질렀다는 이유만으로 부과</td></tr>
<tr><th>베카리아 (${K('예방주의')})</th><td>처벌은 사회적 이익 증진 수단. 살인자에게는 사형보다 예방 효과가 큰 ${K('종신 노역형')}. 형벌은 범죄 억제에 <u>충분한 정도의 강도만</u>. 공리주의자</td></tr>
<tr><th>벤담 (${K('공리주의')})</th><td>최대 다수의 최대 행복. 형벌은 고통을 수반 → 더 큰 악을 제거하는 효과가 보장될 때만 정당. ${S} 형벌의 주요 목적 = ${K('범죄 예방')}</td></tr>
</table></div>
<span class="note">응보주의 → 과거(저지른 죄) / 공리주의 → 미래(예방)</span>`},

{t:'다양한 정의관의 특징과 적용', s:'자유주의(롤스·노직) / 공동체주의(왈처·매킨타이어·샌델)', h:`
<h3>자유주의적 정의관</h3>
<span class="note">개인: 자율성·권리·자유 강조 / 국가: 최소한 역할</span>
<ul>
<li>${K('자유주의')}: 개인의 자유를 존중·보장하는 것이 어떤 가치보다 우위</li>
<li>${K('개인주의')}: 국가·사회보다 개인의 권리와 자유 존중 (≠ 이기적 개인주의)</li>
<li>자유로운 선택과 노력으로 얻은 결과물에 대한 ${K('소유권')}을 절대적 가치로 인정</li>
<li>타인의 ${K('권리')}를 침해하지 않는 한 국가는 간섭하지 않고 자유를 최대한 보장</li>
<li>개인의 자유로운 이익 추구 → 국부 증진 → ${K('공동선')}에 이바지</li>
<li>국가는 국방, 법 질서 유지, 공공재 건설 등 ${K('최소한')}의 역할만</li>
<li>한계: ${K('개인선')}을 지나치게 추구하면 ${K('공동선')} 훼손 / 우연적 조건·운에 의한 분배가 지속되면 동등한 기회 불가</li>
</ul>

<h3>${S} 존 롤스 『정의론』 (평등주의적 자유주의)</h3>
<h4>${K('공정')}으로서의 정의</h4>
<ul>
<li>정의는 발견되는 것이 아니라 구성원들의 ${K('합의')}에 의해 ${K('도출')}되는 것</li>
<li>${K('절차적')} 정의관: 절차의 공정성이 보장되면 결과도 공정 (예: 운동 경기)</li>
<li>사회 제도의 제1덕목은 ${K('정의')} → 효율적인 법·제도라도 정의롭지 못하면 ${K('폐기')}해야</li>
<li>공리주의의 '최대 다수의 최대 행복'에 ${K('반대')} → 소수도 배려해야</li>
<li>인간관: 자기 이익에 관심 있지만 서로에게는 ${K('무관심')}한 합리적 존재, 자기 손실을 감수하면서까지 타인에게 피해를 주려 하지 않음</li>
</ul>
<h4>${S} 원초적 입장 · 무지의 베일</h4>
<ul>
<li>원초적 입장: 상호 무관심한 사람들이 ${K('무지의 베일')} 아래에서 합의를 통해 ${K('정의의 원칙')}을 도출하는 ${K('가상적')} 상황</li>
<li>무지의 베일: 개인 정보를 ${K('모르는 상태')}로 만드는 가상의 도구
 <ul><li>${K('사회적')} 우연성: 신분, 사회적 지위, 계층, 재산 등</li>
 <li>${K('자연적')} 우연성: 소질, 능력, 지능, 가치관, 심리적 성향 등</li></ul></li>
<li>갈등을 키우는 ${K('우연적 조건')}의 결과를 무효화</li>
<li>${S} 단, <b>사회에 관한 일반적 지식은 알고 있음</b></li>
</ul>
<h4>${S} 정의의 원칙 (서열 있음)</h4>
<p>${K('평등한 자유')}의 원칙 &gt; ${K('공정한 기회균등')}의 원칙 &gt; ${K('차등')}의 원칙</p>
<div class="tbl"><table>
<tr><th>제1원칙</th><td><b>평등한 자유의 원칙</b>: 모든 사람은 ${K('기본적 자유')}에 대해 ${K('동등한')} 권리<br>기본적 자유: 정치적 자유, 언론·결사의 자유, <u>재산 소유권</u> 등<br>기본적 자유는 더 광범위한 자유를 위해서만 ${K('제한')} 가능 (침해X)</td></tr>
<tr><th rowspan="2">제2원칙</th><td><b>차등의 원칙</b>: 사회적·경제적 불평등은 ${K('최소 수혜자')}에게 ${K('최대 이익')}을 보장할 때만 정당화. 모두에게 이익이 되지 않는 단순한 불평등은 부정의</td></tr>
<tr><td><b>공정한 기회균등의 원칙</b>: 불평등의 계기가 되는 공직과 지위는 실질적으로 ${K('모든')} 사람에게 개방</td></tr>
</table></div>

<h3>${S} 로버트 노직 『아나키에서 유토피아로』 (자유지상주의)</h3>
<h4>${K('소유권')}으로서의 정의</h4>
<ul>
<li>천부적 재능과 노동력을 포함해 정당하게 소유한 재화에 대해 절대적 ${K('소유권')}(배타적 권리)</li>
<li>동의하거나 타인의 권리를 침해하지 않는 한 누구도 그의 신체·재산에 간섭할 권리 없음</li>
<li>국가는 분배에 관여하기보다 최대한 개인의 ${K('자유')}에 맡겨야</li>
<li>${K('최소 국가')}: 생명·재산 보호에 필요한 최소한의 역할(외침 방어, 치안, 최소한의 세금). 복지 정책·공공사업 ${K('반대')}</li>
<li>${S} 소득 ${K('재분배')} 정책 반대: 소득 재분배 = ${K('강제 노동')}</li>
</ul>
<h4>정의의 원칙</h4>
<div class="tbl"><table>
<tr><th>${K('취득')}의 원칙</th><td>정당한 ${K('노동')}으로 취득한 재화는 <b>타인의 처지를 ${K('악화')}시키지 않는 한</b> 소유 권리 있음<br>예) 마을 사람 모두의 생존이 달린 우물을 한 개인이 독점 → 옳지 않음</td></tr>
<tr><th>${K('이전')}(양도)의 원칙</th><td>① ${K('정당하게')} 취득된 소유물은 자유의사에 따라 처분·양도 가능<br>→ 양도 대상이 먼저 '${K('취득의 원칙')}'을 만족해야 함. 훔친 물건을 양도받으면 정당한 소유권X<br>② 소유주가 ${K('자발적')}으로 건네준 물건에 정당한 소유권 (상속·증여 → 직접 노동 안 해도 OK)</td></tr>
<tr><th>${K('교정')}의 원칙</th><td>취득·양도 과정에서 잘못이 생기면 바로잡아야 함 / 불의를 교정한 후의 소유·분배는 ${K('정당')}</td></tr>
</table></div>

<h3>${S} 롤스 vs 노직</h3>
<div class="tbl"><table>
<tr><th></th><th>롤스</th><th>노직</th></tr>
<tr><th>경제적 불평등</th><td>${K('최소 수혜자')}에게 ${K('최대 이익')}이 될 때 정당화</td><td>${K('정의의 원칙')}(취득·이전·교정)을 모두 만족하면 정당화</td></tr>
<tr><th>소유 권리</th><td>최소 수혜자에게 최대 이익이면 일부 제한 가능</td><td>정당한 소유물은 침해 불가능한 ${K('배타적')} 권리 <span class="pen">(국가 개입X 재분배X)</span></td></tr>
<tr><th>소득 재분배</th><td>차등의 원칙 근거로 <b>가능</b></td><td>강제 노동과 같아 <b>불가</b></td></tr>
<tr><th>공통점</th><td colspan="2">① 소유권 = 모두가 보장받아야 할 기본적 권리, 어떤 경우에도 ${K('침해')} 불가<br>② 특수한 경우 ${K('제한')} 가능 — 롤스: ${K('더 광범위한')} 자유를 위해 / 노직: 타인의 권리를 ${K('침해')}하는 경우<br>③ ${K('절차')}적 정의: 과정이 정당하면 결과도 정당</td></tr>
</table></div>
<div class="tbl"><table>
<tr><th>질문</th><th>롤스</th><th>노직</th></tr>
<tr><td>정의로운 사회에서 경제적 불평등이 허용될 수 있는가?</td><td>O</td><td>O</td></tr>
<tr><td>약자의 경제적 이익 증진을 최우선 정의 원칙으로 삼아야 하는가?</td><td>X</td><td>-</td></tr>
<tr><td>정의의 원칙은 우연성이 배제된 상황에서 합의된다?</td><td>O</td><td>-</td></tr>
<tr><td>정당한 소유물에 대해 배타적 사용권을 가지는가?</td><td>-</td><td>O</td></tr>
<tr><td>직접 노동하지 않아도 정당하게 소유물을 얻을 수 있는가?</td><td>-</td><td>O (상속·증여)</td></tr>
<tr><td>분배 결과의 정당성은 분배 과정의 정당성에 달려 있는가?</td><td>O</td><td>O</td></tr>
<tr><td>최대 다수의 복지를 위해 소수의 자유가 침해될 수 있는가?</td><td>X</td><td>X</td></tr>
</table></div>

<h3>공동체주의적 정의관</h3>
<span class="note">공동선 &gt; 개인선, 자아 = 연고적·서사적 자아</span>
<ul>
<li>의미: 개인의 정체성과 개인선은 공동체와 무관하게 이루어지는 것이 아니라 공동체의 ${K('역사')}와 ${K('전통')}을 공유하는 가운데 형성</li>
<li>개인과 공동체는 ${K('유기적')} 관계 / 정의 = 공동체의 선(good)을 실현하는 것</li>
<li>이기주의를 버리고 ${K('연대 의식')}으로 사회 문제 해결 / 공동선을 위한 자발적 ${K('봉사')}와 헌신 필요 (국가는 이런 미덕을 제시·권장)</li>
<li>${S} 단, 개인의 자유를 억압하는 부당한 관습·제도까지 수용하지 않음</li>
<li>${S} 집단주의(전체주의)와 ${K('구분')}, 극단적 이기주의 ${K('반대')}, 소수 의견 억압 ${K('반대')}, 보편적 도덕 가치 ${K('존중')}</li>
<li>한계: 공동체의 특수성을 지나치게 강조하면 개인 자유 억압 / 능력·노력과 관계없이 불평등하게 배분할 우려 / 부당한 관습·전통 정당화 우려</li>
</ul>
<h4>${S} 왈처 (다원적 평등)</h4>
<ul>
<li>공동체의 역사적·문화적 맥락에 따른 다양한 정의의 기준 인정</li>
<li>부·명예 같은 사회적 가치는 공동체의 산물 → 분배할 때 공동체의 특수성 고려, 분배의 ${K('다원성')} 강조</li>
<li>안전·복지 → 필요 / 돈·상품 → 자유 교환 / 정치권력 → 토론·민주주의(설득력) / 기본 교육 → 엄격한 평등 / 공직 → 자격과 기회의 공정성</li>

</ul>
<div class="src">분배적 정의와 관련된 모든 가치는 사회적 가치이다. 가치는 사회적 맥락과 무관하게 평가되지 않으며, 상이한 사회에서는 상이한 의미를 갖는다. 돈이 성직의 영역에서 분배 기준으로 작용하는 것은 다른 영역을 침해하는 것이므로 부적절하다.<cite>왈처, 『정의와 다원적 평등』</cite></div>
<h4>${S} 매킨타이어 『덕의 상실』</h4>
<ul>
<li>개인의 정체성은 ${K('공동체')}의 역사와 전통 속에서 형성 → 도덕적 판단에도 공동체의 전통·역사 반영</li>
<li>공동체의 덕목을 바탕으로 사회적 역할과 도덕적 책무 수행</li>
<li>서사적 자아: 나는 공동체와 분리되어 존재하지 않음. 가족·도시·부족·민족에게 물려받은 빚과 유산이 나의 도덕적 출발점</li>
</ul>
<h4>${S} 샌델 『자유주의와 정의의 한계』</h4>
<ul>
<li>개인은 ${K('연고적 자아')} → 책임 의식을 가지고 공동선 증진에 기여</li>
<li>연고적 자아: 공동체의 문화와 역사의 영향을 받으며 정체성을 형성하는 자아</li>
<li>도덕적 중립은 처음부터 불가능 → 시민의 적극적 ${K('정치 참여')}와 활발한 ${K('토론')}으로 공동선 실현, 시민적 덕성 함양</li>

<h3>두 정의관의 조화</h3>
<div class="tbl"><table>

{id:'h6',lv:'h',tp:'교정적 정의',q:'교정적 정의에 대한 설명으로 옳은 것은?',o:['사회적·경제적 자원 분배의 공정함이다','손해에 관한 처벌과 배상의 공정함이다','교환의 결과를 공정하게 하는 것이다','기하학적 비례에 따른다','사회 복지 제도를 통해서만 실현된다'],a:1,e:'교정적 정의는 주로 국가의 법 집행에 따른 처벌로 실현되며, 산술적 비례에 해당한다.'},
{id:'h7',lv:'h',tp:'정의관',q:'자유주의적 정의관에 대한 설명으로 옳은 것은?',o:['공동체의 전통이 개인의 자유보다 우선한다','국가는 국방·법 질서 유지 등 최소한의 역할만 담당해야 한다','국가는 개인의 소유권을 적극적으로 제한해야 한다','개인주의는 이기적 개인주의와 같다','공동선이 개인선보다 항상 우선한다'],a:1,e:'자유주의는 개인의 자유를 최우선하며 국가의 역할을 최소화한다. 개인주의는 이기적 개인주의와 다르다.'},
{id:'h8',lv:'h',tp:'정의관',q:'롤스의 입장으로 옳은 것은?',o:['정의는 이미 정해져 있어 발견되는 것이다','최대 다수의 최대 행복을 정의로 본다','정의의 원칙은 원초적 입장에서의 합의로 도출된다','결과의 공정성을 정의의 기준으로 삼는다','경제적 불평등은 어떤 경우에도 허용되지 않는다'],a:2,e:'롤스는 절차적 정의관으로, 공정한 절차(원초적 입장)에서 합의된 원칙이 정의라고 보았다.'},
{id:'h9',lv:'h',tp:'정의관',q:'노직의 입장으로 옳은 것은?',o:['국가는 재화 분배에 적극 관여해야 한다','복지 정책과 공공사업을 찬성한다','정당하게 소유한 재화에 대해 절대적 소유권을 가진다','소득 재분배는 정당하다','타고난 재능으로 얻은 산출물은 사회의 공동 자산이다'],a:2,e:'노직은 소유권으로서의 정의를 주장하며 재분배를 강제 노동으로 본다.'},
{id:'h10',lv:'h',tp:'정의관',q:'공동체주의적 정의관에 대한 설명으로 옳지 않은 것은?',o:['개인의 정체성은 공동체의 역사와 전통 속에서 형성된다','개인과 공동체는 유기적 관계이다','구성원 간 연대 의식을 강조한다','집단주의와 같은 입장으로 공동선을 위해 소수 의견 억압을 인정한다','공동체의 선을 실현하는 것을 정의로 본다'],a:3,e:'공동체주의는 집단주의(전체주의)와 구분되며, 소수 의견 억압에 반대한다.'},
{id:'h11',lv:'h',tp:'실현 노력',q:'사회 복지 제도와 사례의 연결이 옳은 것은?',o:['국민 건강 보험 - 공공 부조','의료 급여 - 사회 보험','장애인 활동 지원 - 사회 서비스','기초 연금 - 사회 보험','산업 재해 보상 보험 - 사회 서비스'],a:2,e:'건강 보험·산재 보험은 사회 보험, 의료 급여·기초 연금은 공공 부조, 장애인 활동 지원은 사회 서비스.'},
{id:'h12',lv:'h',tp:'불평등',q:'사회적 약자에 대한 차별에 대한 설명으로 옳지 않은 것은?',o:['나이, 신체 조건, 출신 지역 등을 기준으로 이루어진다','선입견과 편견이 원인이 된다','차별을 용인하는 사회 환경이 원인이 된다','인간 존엄성을 훼손하고 기본권을 침해한다','사회적 약자는 개인만 해당하며 집단은 포함되지 않는다'],a:4,e:'사회적 약자는 인간다운 삶에 어려움을 겪는 개인 또는 집단이다.'},

{id:'m1',lv:'m',tp:'교정적 정의',p:'<p>형벌은 오직 범죄를 저질렀기 때문에 가해지는 것이다. 동등성의 원리에 따라 범죄자에게는 범죄와 동등한 형벌이 가해져야 한다. 그러므로 살인을 한 사람은 사형에 처해져야 한다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['처벌은 사회적 이익을 증진하는 수단이다','형벌의 정당성은 범죄 예방 효과에 따라 결정된다','처벌은 범죄자가 범죄를 저질렀다는 이유만으로 부과되어야 한다','살인자에게는 종신 노역형이 더 효과적이다','형벌의 목적은 최대 다수의 최대 행복이다'],a:2,e:'칸트(응보주의). 나머지는 베카리아·벤담 같은 공리주의(예방주의) 입장이다.'},
{id:'m2',lv:'m',tp:'교정적 정의',p:'<p>형벌의 목적은 범죄자가 시민에게 해악을 입힐 가능성을 방지하고, 일반 시민이 유사한 행위를 할 가능성을 억제하는 것이다. 사형보다는 종신 노역형이 범죄 예방에 더 효과적이다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['응보주의 입장에 서 있다','형벌의 강도는 범죄를 억제하기에 충분한 정도만 가져야 한다','처벌은 범죄에 대한 응당한 보복이어야 한다','살인자에 대한 사형은 정당하다','형벌의 목적은 과거 범죄에 대한 대가를 치르게 하는 것뿐이다'],a:1,e:'베카리아(예방주의·공리주의). 형벌은 범죄 억제에 충분한 강도만 가져야 한다고 보았다.'},
{id:'m3',lv:'m',tp:'정의관',p:'<p>합리적 인간들이 평등하고 자유로운 가상적 상황에 놓여 있다고 하자. 누구도 자신의 사회적 지위와 계층을 모르며, 어떤 소질·능력·지능을 타고났는지도 모른다. 정의의 원칙들은 이러한 베일 속에서 선택된다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['합의 당사자는 사회에 관한 일반적 지식도 모른다','사회적·자연적 우연성이 합의에 영향을 미치지 못하게 하려는 장치이다','정의의 원칙은 이미 존재하며 발견되는 것이다','합의의 절차보다 결과의 평등이 중요하다','합의 당사자들은 타인의 이익에 큰 관심을 가진다'],a:1,e:'롤스의 무지의 베일. 일반적 지식은 알고, 당사자들은 상호 무관심하다.'},
{id:'m4',lv:'m',tp:'정의관',p:'<p>어떤 소유물의 취득과 이전 과정이 부당하면 국가가 교정해야 하지만, 정당하면 그 소유물에 대한 소유 권리를 보장해야 한다. 개인은 자신의 타고난 재능에 대한 소유 권리를 가지며, 그로부터 산출되는 것에 대해서도 소유 권리를 가진다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['타고난 재능으로 얻은 산출물에는 소유 권리가 없다','빈부 격차는 그 자체로 부정의하다','소유물의 취득·이전 과정이 부당하면 국가가 교정할 수 있다','최소 수혜자를 위해 누진세를 부과해야 한다','국가는 분배에 적극 개입해야 한다'],a:2,e:'노직: 취득·양도의 원칙이 지켜지면 빈부 격차는 부정의하지 않고, 지켜지지 않으면 국가가 교정할 수 있다.'},
{id:'m5',lv:'m',tp:'분배적 정의',p:'<p><b>A</b>: 기회의 평등이 실현된 상태에서 자유롭게 경쟁하여 이룬 성과에 따라 분배<br><b>B</b>: 목적 달성에 필요한 전문적 지식과 자질(잠재력)에 따라 분배<br><b>C</b>: 인간다운 삶을 위한 기본적 욕구 충족의 우선순위에 따라 분배</p>',q:'A~C 분배 기준에 대한 설명으로 옳은 것은?',o:['A는 서로 다른 종류의 업적의 양과 질을 비교하기 쉽다','B는 능력에 대한 평가 기준을 정하기 쉽다','C는 개인의 성취동기와 창의성을 높인다','C는 가치 있는 재화가 한정되어 모든 필요를 충족하기 어렵다','A는 기회의 평등이 보장되지 않아도 약자에게 유리하다'],a:3,e:'A 업적, B 능력, C 필요. C는 재화의 한정성 때문에 모든 필요를 충족할 수 없다.'},
{id:'m6',lv:'m',tp:'정의관',p:'<p>나는 공동체와 분리되어 존재하지 않는다. 나는 특정한 친족과 부족, 민족에 속해 있으며, 나에게 좋은 것은 이러한 역할을 수행하는 사람들에게도 좋아야 한다. 나는 가족, 도시, 부족, 민족으로부터 다양한 빚과 유산을 물려받는다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['개인의 정체성은 공동체의 역사와 전통 속에서 형성된다','자아는 사회적 역할과 지위로부터 분리될 수 있다','국가는 개인의 자유를 보호하는 수단일 뿐이다','도덕적 판단은 공동체의 전통과 무관하다','개인은 스스로 선택한 의무만 진다'],a:0,e:'매킨타이어(공동체주의). 나머지는 자유주의 입장이다.'},
{id:'m7',lv:'m',tp:'정의관',p:'<p>흔히 법과 정치는 도덕적 논쟁에 휘말리지 않아야 한다고 하지만 도덕적 중립을 지키는 것은 처음부터 불가능하다. 정의로운 사회를 위해서는 좋은 삶이 무엇인지 함께 고민하고, 공동체 구성원으로서 미덕을 키우며 공동선을 실현하기 위해 노력해야 한다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['국가는 좋은 삶에 대해 중립을 지켜야 한다','시민의 적극적 정치 참여와 활발한 토론이 중요하다','개인은 공동체와 무관한 무연고적 자아이다','정의는 원초적 입장에서의 합의로 도출된다','개인의 소유권은 절대적이다'],a:1,e:'샌델. 연고적 자아를 강조하며 정치 참여와 토론으로 공동선을 실현해야 한다고 보았다.'},
{id:'m8',lv:'m',tp:'정의관',p:'<p>사회적 안전과 의료 혜택은 필요에 의해, 화폐는 자유 교환에 의해, 기본 교육은 엄격한 평등에 의해, 정치적 권력은 설득력과 민주주의에 의해 분배되어야 한다. 이러한 차이는 역사적이고 문화적인 특수성의 필연적 산물이다.</p>',q:'위 사상가의 입장으로 옳은 것은?',o:['모든 사회적 가치는 하나의 기준으로 분배해야 한다','사회적 가치의 의미는 모든 사회에서 동일하다','돈이 권력과 명예를 지배하는 것은 정당하다','사회적 가치는 공동체의 맥락에 따라 다양한 기준으로 분배되어야 한다','모든 가치는 오직 필요에 따라 분배되어야 한다'],a:3,e:'왈처(다원적 평등). 한 가치가 다른 영역을 지배하는 것은 폭정이다.'},
{id:'m9',lv:'m',tp:'실현 노력',p:'<p><b>A</b>: 소득이 있는 개인·기업·정부가 보험료를 분담하며, 법률이 정한 기준에 해당하면 의무 가입한다.<br><b>B</b>: 생활이 어려운 계층을 국가와 지방 자치 단체가 세금으로 전액 지원한다.<br><b>C</b>: 도움이 필요한 국민에게 상담, 재활, 돌봄 등의 서비스를 제공한다.</p>',q:'A~C에 대한 설명으로 옳은 것은?',o:['A는 가입 여부를 자유롭게 선택할 수 있다','B는 A보다 소득 재분배 효과가 크다','C는 금전적 지원을 원칙으로 한다','국민연금은 B에 해당한다','기초 연금은 A에 해당한다'],a:1,e:'A 사회 보험, B 공공 부조, C 사회 서비스. 국민연금은 A, 기초 연금은 B.'},
{id:'m10',lv:'m',tp:'불평등',p:'<p>시·도별 도서관까지 도보 시간(국토연구원, 2022)</p><div class="tbl"><table><tr><th>서울</th><th>부산</th><th>경기</th><th>전남</th><th>경북</th><th>강원</th></tr><tr><td>14분</td><td>32분</td><td>54분</td><td>100분</td><td>113분</td><td>122분</td></tr></table></div>',q:'위 자료에 대한 분석으로 가장 적절한 것은?',o:['강원의 접근 시간은 서울의 약 2배이다','특별시·광역시가 도 지역보다 대체로 접근성이 낮다','공간 불평등이 지역민의 삶의 질 격차로 이어질 수 있음을 보여 준다','이런 격차는 균형 개발 방식에서 비롯되었다','접근성 격차는 사회적 약자 차별에만 해당하는 문제이다'],a:2,e:'강원은 서울의 약 8.7배. 이런 격차는 성장 거점 개발에서 비롯된 공간 불평등의 사례이다.'},
{id:'m11',lv:'m',tp:'실현 노력',p:'<p>· 대한민국: 정당이 비례 대표 후보자를 추천할 때 후보자의 절반 이상을 여성으로 추천하도록 한다.<br>· 노르웨이: 이사회 정원에 따라 남녀 비율을 준수하게 하고, 미달 시 경고·벌금을 거쳐 상장 폐지까지 가능하다.</p>',q:'위 제도에 대한 설명으로 옳은 것은?',o:['개인의 업적만을 기준으로 한 분배이다','구조화된 성 불평등에 대처하는 적극적 평등 실현 조치이다','사회 보험의 일종이다','공간 불평등을 완화하기 위한 정책이다','교정적 정의에 따른 형벌이다'],a:1,e:'여성 할당제는 적극적 평등 실현 조치이며, 지나치면 역차별 논란이 생길 수 있다.'},
{id:'m12',lv:'m',tp:'정의관',p:'<p>(가) 다수는 개발 제한 구역의 혜택을 누리지만, 소수의 토지 소유자는 재산권 행사에 상당한 제약을 받는다.<br>(나) 개발 제한 구역은 도시의 허파 역할을 하므로, 미래를 위해 보존해야 한다.</p>',q:'(가), (나)에 대한 설명으로 옳은 것은?',o:['(가)는 공동선이 개인의 재산권보다 우선한다고 본다','(나)는 개인의 재산권 행사 제약을 가장 중시한다','(가)는 자유주의 입장에서 재산권 제약을 문제 삼는다','(나)는 개인선이 공동선에 항상 우선한다고 본다','(가), (나) 모두 공동체주의 입장이다'],a:2,e:'(가) 자유주의(재산권 중시), (나) 공동체주의(공동선 중시).'},

{id:'s1',lv:'s',tp:'정의관',f:1,p:'<p><b>갑</b>: 사회적·경제적 불평등은 최소 수혜자에게 최대의 이익이 되도록 편성되어야 한다.<br><b>을</b>: 소유물의 취득과 이전 과정이 정당하다면 그 소유물에 대한 권리는 보장되어야 하며, 국가의 재분배는 강제 노동과 다를 바 없다.</p>',q:'갑, 을의 입장에 대한 설명으로 옳은 것만을 고른 것은?',b:['갑: 경제적 불평등은 최소 수혜자에게 최대 이익이 될 때 정당화된다.','을: 소득 재분배를 위한 과세는 강제 노동과 같다.','갑, 을 모두 분배 결과의 정당성은 분배 과정의 정당성에 달려 있다고 본다.','을은 갑과 달리 정의로운 사회에서 경제적 불평등은 허용될 수 없다고 본다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄷ','ㄴ, ㄷ, ㄹ'],a:3,e:'갑 롤스, 을 노직. 둘 다 절차적 정의관이며, 둘 다 경제적 불평등을 허용한다(ㄹ 틀림).'},
{id:'s2',lv:'s',tp:'교정적 정의',f:1,p:'<p><b>갑</b>: 사법적 처벌은 범죄자 자신이나 시민 사회의 다른 선을 증진하는 수단으로 행해져서는 안 되고, 범죄를 저질렀다는 이유만으로 부과되어야 한다.<br><b>을</b>: 사법적 처벌이 정당화되려면 범죄자가 새로운 해악을 입힐 가능성을 막고 타인의 범죄를 억제하기에 충분한 정도의 강도만 가져야 한다.</p>',q:'갑, 을의 입장에 대한 설명으로 옳은 것만을 고른 것은?',b:['갑: 처벌은 공익 증진의 수단이다.','을: 형벌의 강도는 범죄 억제에 충분한 정도여야 한다.','갑, 을 모두 살인자는 사형에 처해야 한다고 본다.','을은 갑과 달리 범죄 예방을 형벌의 목적으로 본다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ','ㄱ, ㄷ, ㄹ'],a:2,e:'갑 칸트(응보주의), 을 베카리아(예방주의). 베카리아는 사형보다 종신 노역형을 주장했다.'},
{id:'s3',lv:'s',tp:'정의관',q:'롤스의 정의의 원칙에 대한 설명으로 옳은 것은?',o:['경제적 효율을 높인다면 언론의 자유를 제한할 수 있다','모든 사회적·경제적 불평등은 부정의하다','기본적 자유는 더 광범위한 자유를 위해서만 제한될 수 있다','차등의 원칙은 평등한 자유의 원칙보다 우선한다','최소 수혜자에게 불리하더라도 사회 전체의 부가 늘면 불평등은 정당하다'],a:2,e:'제1원칙이 최우선이며, 기본적 자유는 더 광범위한 자유를 위해서만 제한 가능. 모두에게 이익이 되지 않는 단순한 불평등만 부정의하다.'},
{id:'s4',lv:'s',tp:'정의관',f:1,p:'<p>(가) 갑은 훔친 자전거를 을에게 팔았고, 을은 그 대가를 지불했다.<br>(나) 병은 부모가 정당하게 모은 재산을 상속받았다.<br>(다) 정은 마을 사람 모두의 생존이 달린 유일한 우물을 독점하려 한다.</p>',q:'노직의 입장에서 판단한 것으로 옳은 것만을 고른 것은?',b:['(가)에서 을은 대가를 지불했으므로 자전거에 대한 정당한 소유권을 가진다.','(나)에서 병은 직접 노동하지 않았더라도 정당한 소유권을 가진다.','(다)는 타인의 처지를 악화시키므로 취득의 원칙에 어긋난다.','(가)의 잘못은 교정의 원칙에 따라 바로잡아야 한다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'],a:4,e:'양도의 원칙은 대상이 취득의 원칙을 만족해야 성립하므로 훔친 물건은 정당한 소유권X.'},
{id:'s5',lv:'s',tp:'정의관',f:1,p:'<p><b>갑</b>: 도덕적 중립은 처음부터 불가능하다. 좋은 삶이 무엇인지 함께 고민하며 공동체 구성원으로서 미덕을 키워야 한다.<br><b>을</b>: 개인의 자아 정체성은 공동체가 부여한 역할보다 개인의 선택에 의해 형성된다.</p>',q:'갑, 을의 입장에 대한 설명으로 옳은 것만을 고른 것은?',b:['갑: 국가는 좋은 삶에 대해 중립을 지켜야 한다.','갑: 시민의 적극적 정치 참여와 토론으로 공동선을 실현해야 한다.','을: 개인의 자아는 공동체의 역사가 부여한 역할로 규정된다.','갑은 을과 달리 개인을 연고적 자아로 본다.'],o:['ㄱ, ㄴ','ㄴ, ㄹ','ㄱ, ㄷ','ㄷ, ㄹ','ㄴ, ㄷ, ㄹ'],a:1,e:'갑 샌델(공동체주의), 을 자유주의.'},
{id:'s6',lv:'s',tp:'분배적 정의',f:1,p:'<p>○○고 장학금 선발 기준<br>A 장학금: 지난 학기 성적 상위 5%<br>B 장학금: 가정 형편이 어려운 학생<br>C 장학금: 예체능·과학 분야 특기가 뛰어난 학생</p>',q:'A~C의 분배 기준에 대한 설명으로 옳은 것만을 고른 것은?',b:['A는 서로 다른 종류의 업적의 양과 질을 비교하기 어렵다는 한계가 있다.','B는 개인의 성취동기를 높이는 데 효과적이다.','C는 능력의 일부가 선천적·우연적으로 결정된다는 점을 고려하지 못한다.','B는 기회의 평등을 넘어 결과의 평등을 추구한다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄱ, ㄷ, ㄹ'],a:4,e:'A 업적, B 필요, C 능력. 필요에 따른 분배는 오히려 성취동기를 떨어뜨릴 수 있다.'},
{id:'s7',lv:'s',tp:'실현 노력',f:1,p:'<p>A: 국민 기초 생활 보장 제도 &nbsp; B: 고용 보험 &nbsp; C: 가사·간병 서비스</p>',q:'A~C에 대한 설명으로 옳은 것만을 고른 것은?',b:['A는 B와 달리 수혜자가 보험료를 부담하지 않는다.','B는 경제적 능력에 따라 보험료를 부담하며 소득 재분배 효과가 있다.','C는 금전적 지원을 원칙으로 한다.','A, B 모두 법률에 따른 강제 가입을 원칙으로 한다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'],a:0,e:'A 공공 부조(세금, 전액 지원), B 사회 보험(의무 가입), C 사회 서비스(비금전적).'},
{id:'s8',lv:'s',tp:'불평등',f:1,p:'<p>A: 중간 계층이 줄고 상층과 하층으로 쏠리는 현상<br>B: 지역 간 자원이 불균등하게 분배되어 격차가 발생하는 현상<br>C: 나이, 신체 조건, 출신 지역 등을 기준으로 불합리한 차별을 받는 현상</p>',q:'A~C에 대한 설명으로 옳은 것만을 고른 것은?',b:['A는 재산과 소득 차이에 따른 경제적 격차 심화에서 비롯된다.','B는 균형 개발 방식을 채택하면서 심화되었다.','C는 선입견과 편견, 차별을 용인하는 사회 환경에서 비롯된다.','A가 고착화되면 부모의 경제적 능력이 자녀에게 대물림될 수 있다.'],o:['ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄷ, ㄹ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'],a:2,e:'B(공간 불평등)는 성장 거점 개발 방식에서 비롯되었다.'},
{id:'s9',lv:'s',tp:'정의관',f:1,q:'자유주의적 정의관과 공동체주의적 정의관에 대한 설명으로 옳은 것만을 고른 것은?',b:['자유주의: 개인의 자유로운 이익 추구가 국부 증진으로 이어져 공동선에 이바지한다.','공동체주의: 개인과 공동체는 유기적 관계이다.','공동체주의: 공동선을 위해서라면 소수 의견을 억압할 수 있다.','자유주의: 개인선을 지나치게 추구하면 공동선이 훼손될 수 있다는 한계가 있다.'],o:['ㄱ, ㄴ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'],a:3,e:'공동체주의는 소수 의견 억압, 집단주의에 반대한다.'},
{id:'s10',lv:'s',tp:'정의의 의미',f:1,p:'<p><b>갑</b>: 정의는 각자가 자기 성향에 가장 맞는 국가와 관련된 일 한 가지에 종사하며 타인에게 참견하지 않는 것이다.<br><b>을</b>: 동등한 사람들이 동등하지 않은 몫을, 혹은 동등하지 않은 사람들이 동등한 몫을 분배받게 되면 싸움과 불평이 생긴다.</p>',q:'갑, 을의 입장에 대한 설명으로 옳은 것만을 고른 것은?',b:['갑: 국가의 정의는 영혼의 정의와 같은 방식으로 실현된다.','갑: 통치자에게는 지혜와 절제의 덕이 요구된다.','을: 분배적 정의는 산술적 비례에 따른다.','을: 법을 지키는 것을 일반적 정의로 본다.'],o:['ㄱ, ㄴ, ㄹ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄷ'],a:0,e:'갑 플라톤, 을 아리스토텔레스. 분배적 정의는 기하학적 비례(ㄷ 틀림).'},
{id:'s11',lv:'s',tp:'교정적 정의',f:1,p:'<p><b>갑</b>: 사법적 처벌은 범죄자나 시민 사회의 다른 선을 증진하는 수단으로 행해져서는 절대 안 된다.<br><b>을</b>: 형벌은 고통을 수반하므로 더 큰 악을 제거하는 효과가 보장될 때에만 정당화된다. 형벌의 주요 목적은 범죄 예방이다.</p>',q:'갑, 을의 입장에 대한 설명으로 옳은 것만을 고른 것은?',b:['을: 형벌은 미래의 범죄 예방에 초점을 둔다.','갑: 처벌은 다른 선을 증진하는 수단이 되어서는 안 된다.','을: 예방 효과가 없더라도 응당한 보복이라면 형벌은 정당하다.','갑, 을 모두 교정적 정의와 관련된 입장이다.'],o:['ㄱ, ㄷ','ㄴ, ㄷ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ','ㄷ, ㄹ'],a:2,e:'갑 칸트(응보주의), 을 벤담(공리주의). ㄷ은 응보주의 논리라 벤담과 맞지 않는다.'},
{id:'s12',lv:'s',tp:'정의관',f:1,q:'롤스가 "예"라고 대답할 질문만을 고른 것은?',b:['정의로운 사회에서 경제적 불평등이 허용될 수 있는가?','사회적 약자의 경제적 이익 증진을 최우선의 정의 원칙으로 삼아야 하는가?','정의의 원칙은 우연성이 배제된 상황에서 합의되는가?','최대 다수의 복지 증진을 위해 소수의 자유가 침해될 수 있는가?'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ'],a:1,e:'최우선 원칙은 평등한 자유의 원칙이다(ㄴ 아니오). 공리주의적 소수 희생에는 반대(ㄹ 아니오).'},

{id:'x1',lv:'x',tp:'정의관',p:'<p><b>갑</b>: 사회적·경제적 불평등은 최소 수혜자에게 최대 이익이 되고, 공정한 기회균등 아래 모두에게 개방된 직위와 결부될 때 정당하다.<br><b>을</b>: 정당한 절차로 취득하거나 양도받은 소유물에 대해서는 누구도 간섭할 수 없으며, 국가는 최소한의 역할만 해야 한다.<br><b>병</b>: 사회적 가치는 공동체의 역사적·문화적 산물이므로, 안전과 복지는 필요에 따라, 돈과 상품은 자유 교환에 따라, 정치권력은 설득과 민주주의에 따라 분배되어야 한다.</p>',q:'갑~병의 입장에 대한 설명으로 옳은 것은?',o:['갑은 을과 달리 절차적 정의관을 가진다','을은 갑과 달리 재산 소유권을 기본적 자유로 인정한다','병은 갑과 달리 사회적 가치의 의미가 공동체의 맥락에 따라 달라진다고 본다','갑, 을 모두 국가의 소득 재분배 정책이 정당하다고 본다','을, 병 모두 하나의 분배 기준을 모든 영역에 똑같이 적용해야 한다고 본다'],a:2,e:'갑 롤스, 을 노직, 병 왈처. 롤스·노직 모두 절차적 정의관이고, 롤스도 재산 소유권을 기본적 자유에 포함한다(② 함정). 노직은 재분배 반대.'},
{id:'x2',lv:'x',tp:'정의관',f:1,p:'<p>기본적 자유와 공정한 기회균등이 똑같이 보장된 가상 사회 A~C의 계층별 연 소득 (각 계층 인구 비율 동일, 단위: 백만 원)</p><div class="tbl"><table><tr><th>사회</th><th>상층</th><th>중층</th><th>하층</th></tr><tr><td>A</td><td>100</td><td>60</td><td>20</td></tr><tr><td>B</td><td>60</td><td>50</td><td>40</td></tr><tr><td>C</td><td>80</td><td>55</td><td>35</td></tr></table></div><p class="muted">단, 사회 전체 소득의 합이 클수록 행복의 총량도 크다고 가정한다.</p>',q:'이에 대한 판단으로 가장 적절한 것은?',o:['롤스는 소득 총합이 가장 큰 A를 가장 정의로운 사회로 본다','롤스는 B를, 벤담은 A를 가장 바람직한 사회로 볼 것이다','롤스는 계층 간 불평등이 존재하는 B를 부정의하다고 본다','벤담은 최소 수혜자의 소득이 가장 높은 B를 선택한다','노직은 계층 간 격차가 가장 작은 B를 가장 정의롭다고 판단한다'],a:1,e:'차등의 원칙 → 최하층 소득이 가장 높은 B(40). 벤담 → 총합이 가장 큰 A(180). 노직은 결과의 분배 형태가 아니라 취득·이전 과정의 정당성으로 판단한다.'},
{id:'x3',lv:'x',tp:'정의관',f:1,p:'<p>무인도에 표류한 사람들 중 A는 섬의 유일한 샘물을 먼저 발견하고 울타리를 쳐 독점하였다. 그 결과 다른 사람들은 마실 물을 구할 수 없게 되었다. 이후 B는 A와 정당한 계약을 맺어 대가를 치르고 샘물을 넘겨받았다.</p>',q:'노직의 입장에서 판단한 것으로 옳은 것만을 고른 것은?',b:['B는 자발적 거래로 샘물을 넘겨받았으므로 정당한 소유권을 가진다.','A의 취득은 타인의 처지를 악화시켰으므로 취득의 원칙에 어긋난다.','샘물의 소유 상태는 교정의 원칙에 따라 바로잡혀야 한다.','노직은 이 경우에도 국가가 소유 관계에 개입할 수 없다고 본다.'],o:['ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄹ','ㄷ, ㄹ','ㄱ, ㄴ, ㄷ'],a:1,e:'이전의 원칙은 양도 대상이 먼저 취득의 원칙을 만족해야 한다. A의 취득이 부당하므로 B도 정당한 소유권이 없고, 교정의 원칙에 따라 국가가 바로잡을 수 있다.'},
{id:'x4',lv:'x',tp:'정의관',f:1,p:'<p><b>갑</b>: 나는 내가 존재하기로 선택한 것이며, 나의 자아는 사회적·역사적 역할과 지위로부터 분리될 수 있다.<br><b>을</b>: 나는 가족, 도시, 부족, 민족으로부터 다양한 빚과 유산, 정당한 기대와 의무를 물려받는다. 이것은 내 삶에 주어진 바이며 나의 도덕적 출발점이다.</p><p>(가) 갑만의 입장 &nbsp;(나) 갑, 을의 공통 입장 &nbsp;(다) 을만의 입장</p>',q:'(가)~(다)에 들어갈 내용으로 옳은 것만을 고른 것은?',b:['(가): 개인의 자아 정체성은 개인의 선택에 의해 형성된다.','(나): 개인의 자유를 억압하는 부당한 관습은 정당화될 수 없다.','(다): 공동선을 위해서라면 소수의 의견을 억압할 수 있다.','(다): 개인의 도덕적 판단에는 공동체의 전통과 역사가 반영된다.'],o:['ㄱ, ㄴ','ㄴ, ㄷ','ㄱ, ㄴ, ㄹ','ㄱ, ㄷ, ㄹ','ㄴ, ㄷ, ㄹ'],a:2,e:'갑 자유주의, 을 매킨타이어. 공동체주의도 부당한 관습은 수용하지 않으며, 소수 의견 억압에 반대한다.'},
{id:'x5',lv:'x',tp:'교정적 정의',p:'<p><b>갑</b>: 살인자는 사형에 처해야 한다. 처벌은 범죄를 저질렀다는 이유만으로 부과되어야 한다.<br><b>을</b>: 살인자에 대한 처벌은 사형보다 범죄 예방 효과가 큰 종신 노역형이 바람직하다.<br><b>병</b>: 모든 법의 목적은 공동체 전체의 행복 증진이며, 범죄 예방 효과가 큰 형벌일수록 정당하다.</p>',q:'갑~병의 입장에 대한 설명으로 옳은 것은?',o:['을, 병은 형벌의 주된 목적을 범죄 예방에 둔다','갑은 병과 달리 처벌이 사회 전체의 행복을 증진할 때만 정당하다고 본다','을은 갑과 달리 살인자에 대한 사형에 찬성한다','병은 형벌이 그 자체로 선이라고 본다','갑, 을 모두 형벌의 강도는 범죄 억제에 필요한 만큼이어야 한다고 본다'],a:0,e:'갑 칸트, 을 베카리아, 병 벤담. 벤담은 형벌이 고통을 수반하는 악이므로 더 큰 악을 막을 때만 정당하다고 보았다.'},
{id:'x6',lv:'x',tp:'정의관',f:1,p:'<p>어느 정부가 최소 수혜자의 소득을 크게 높이는 경제 정책을 추진하면서, 정책에 반대하는 특정 집단의 언론·결사의 자유를 제한하고, 고위 공직을 최소 수혜자 계층에게만 개방하기로 하였다.</p>',q:'롤스의 입장에서 이 정책을 평가한 것으로 옳은 것만을 고른 것은?',b:['최소 수혜자에게 최대 이익이 되므로 정당하다.','평등한 자유의 원칙이 차등의 원칙에 우선하므로 언론·결사의 자유 제한은 정당화될 수 없다.','공직을 최소 수혜자에게만 개방하는 것은 차등의 원칙에 따라 정당하다.','기본적 자유는 더 광범위한 자유를 위해서만 제한될 수 있다.'],o:['ㄱ, ㄷ','ㄴ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'],a:2,e:'원칙 간 서열이 핵심. 공정한 기회균등의 원칙상 공직은 모든 사람에게 개방되어야 하며, 이것도 차등의 원칙보다 앞선다.'},
{id:'x7',lv:'x',tp:'정의관',q:'어느 학교가 "시험 성적이 높은 학생일수록 급식을 더 많이 배식한다"는 규칙을 만들었다. 왈처의 입장에서 평가한 것으로 가장 적절한 것은?',o:['성적이라는 단일 기준으로 모든 가치를 분배하는 것이 가장 공정하다','급식은 필요에 따라 분배되어야 하며, 교육 영역의 기준이 이를 지배하는 것은 부당하다','사회적 가치의 의미는 어느 사회에서나 동일하므로 문제가 없다','돈이 정치권력을 얻는 수단으로 쓰이는 것처럼 자유 교환이므로 정당하다','공동체의 문화적 맥락을 배제하고 보편적 기준을 세워야 한다'],a:1,e:'왈처는 각 가치에 고유한 분배 영역과 기준이 있으며, 한 영역의 기준이 다른 영역을 지배하는 것을 부당하다고 본다.'},
{id:'x8',lv:'x',tp:'실현 노력',f:1,p:'<p>사회 복지 제도 A~C에 대한 질문과 답</p><div class="tbl"><table><tr><th>질문</th><th>A</th><th>B</th><th>C</th></tr><tr><td>수혜자가 보험료를 납부하는가?</td><td>예</td><td>아니요</td><td>아니요</td></tr><tr><td>비금전적 서비스 제공을 원칙으로 하는가?</td><td>아니요</td><td>아니요</td><td>예</td></tr></table></div>',q:'A~C에 대한 설명으로 옳은 것만을 고른 것은?',b:['국민연금은 A에 해당한다.','B는 A보다 소득 재분배 효과가 크다.','의료 급여는 C에 해당한다.','C는 저소득층만을 대상으로 한다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ'],a:0,e:'A 사회 보험, B 공공 부조, C 사회 서비스. 의료 급여는 공공 부조(B), 사회 서비스는 도움이 필요한 모든 국민 대상.'},
{id:'x9',lv:'x',tp:'불평등',p:'<p>시·도별 도서관까지 도보 시간(분, 국토연구원, 2022)</p><div class="tbl"><table><tr><th>서울</th><th>부산</th><th>대전</th><th>경기</th><th>울산</th><th>충남</th><th>전남</th><th>강원</th></tr><tr><td>14</td><td>32</td><td>44</td><td>54</td><td>66</td><td>72</td><td>100</td><td>122</td></tr></table></div>',q:'위 자료에 대한 분석으로 옳은 것은?',o:['강원의 도서관 접근 시간은 서울의 8배 이상이다','모든 광역시는 모든 도 지역보다 도서관 접근성이 높다','부산의 접근 시간은 서울의 2배 미만이다','대전은 경기보다 도서관 접근성이 낮다','이러한 격차는 성장 거점 개발 방식과 무관하다'],a:0,e:'122÷14≈8.7. 울산(66분)은 경기(54분)보다 오래 걸려 ②는 틀림. 부산은 서울의 약 2.3배.'},
{id:'x10',lv:'x',tp:'정의관',f:1,q:'롤스와 노직의 소유권에 대한 입장으로 옳은 것만을 고른 것은?',b:['롤스는 노직과 달리 재산 소유권을 기본적 자유로 인정하지 않는다.','롤스는 최소 수혜자에게 최대 이익이 된다면 소유권을 일부 제한할 수 있다고 본다.','노직은 타인의 권리를 침해하는 경우 소유권이 제한될 수 있다고 본다.','노직은 상속으로 얻은 재산은 직접 노동한 결과가 아니므로 부당하다고 본다.'],o:['ㄱ, ㄴ','ㄱ, ㄹ','ㄴ, ㄷ','ㄷ, ㄹ','ㄱ, ㄷ, ㄹ'],a:2,e:'롤스는 재산 소유권을 기본적 자유에 포함한다. 노직은 자발적 양도(상속·증여)로 얻은 재산도 정당하다고 본다.'},
{id:'x11',lv:'x',tp:'정의의 의미',f:1,q:'플라톤의 정의관에 대한 설명으로 옳은 것만을 고른 것은?',b:['국가의 세 계층 모두에게 절제의 덕이 요구된다.','생산자 계층에게는 절제의 덕만 요구된다.','방위자 계층에게는 지혜와 용기의 덕이 요구된다.','영혼의 이성에 대응하는 국가의 계층은 통치자이다.'],o:['ㄱ, ㄷ','ㄴ, ㄹ','ㄱ, ㄴ, ㄷ','ㄱ, ㄴ, ㄹ','ㄴ, ㄷ, ㄹ'],a:3,e:'방위자는 용기와 절제. 이성-통치자, 기개-방위자, 욕구-생산자.'},
{id:'x12',lv:'x',tp:'분배적 정의',f:1,q:'분배 기준에 대한 설명으로 옳은 것만을 고른 것은?',b:['업적에 따른 분배는 기회의 평등이 실현된 상태를 전제로 할 때 정의롭다.','능력이 있다고 해서 반드시 업적을 내는 것은 아니다.','필요에 따른 분배는 개인의 성취동기를 높여 경제적 효율성을 증대시킨다.','능력에 따른 분배는 능력이 선천적·우연적으로 결정된다는 점을 충분히 고려한다.'],o:['ㄱ, ㄴ','ㄱ, ㄷ','ㄴ, ㄹ','ㄷ, ㄹ','ㄱ, ㄴ, ㄹ'],a:0,e:'필요 → 성취동기 저하·비효율이 단점. 능력 → 선천적·우연적 요소를 고려하지 못하는 것이 단점.'}

function bogiMulti(g,lv,nEnt,n,min,max){
  const ks=withPs(g,g.cmp); if(ks.length<nEnt) return null;
  const es=pickN(ks,nEnt), s=pickStmts(stmts(g,es),n,min,max); if(!s) return null;
  const ans=s.map((x,i)=>x.v?i:-1).filter(i=>i>=0), co=comboOpts(n,ans,min,max), L=labs(g).L;
  return {lv,ch:g.ch,p:psgMulti(g,es),q:`${L[0]}${nEnt>2?'~'+L[nEnt-1]:', '+L[1]}의 입장에 대한 설명으로 옳은 것만을 &lt;보기&gt;에서 고른 것은?`,
    b:s.map(x=>x.x),...co,e:reveal(g,es)+s.map((x,i)=>`${BG[i]}. ${x.v?'O':'X — '+x.w}`).join('<br>')};
}
function singleMulti(g,lv,nEnt){
  const ks=withPs(g,g.cmp); if(ks.length<nEnt) return null;
  const es=pickN(ks,nEnt), pool=stmts(g,es).filter(x=>x.cmp), pos=Math.random()<.65;
  const A=pool.filter(x=>x.v===pos), B=pool.filter(x=>x.v!==pos);
  if(!A.length) return null;
  const key=rnd(A), used=new Set([key.c]), rest=[];
  for(const x of shuffle(B)){ if(used.has(x.c)) continue; used.add(x.c); rest.push(x); if(rest.length===4) break; }
  if(rest.length<4) return null;
  const ord=shuffle([key,...rest]), L=labs(g).L;
  return {lv,ch:g.ch,p:psgMulti(g,es),q:`${L[0]}~${L[nEnt-1]}에 대한 설명으로 ${pos?'옳은':'<u>옳지 않은</u>'} 것은?`,
    o:ord.map(x=>x.x),a:ord.indexOf(key),e:reveal(g,es)+ord.map((x,i)=>`${NUM[i]} ${x.v?'O':'X — '+x.w}`).join('<br>')};
}
function genS(g){
  const r=Math.random();
  if(g.cmp.length>=2&&r<.6) return bogiMulti(g,'s',2,4,2,3)||bogiOne(g,'s',4,2,3);
  return bogiOne(g,'s',4,2,3);
}
function genX(g){
  const r=Math.random();
  if(g.cmp.length>=3&&r<.5) return singleMulti(g,'x',3)||bogiMulti(g,'x',2,5,2,4);
  if(g.cmp.length>=2&&r<.85) return bogiMulti(g,'x',g.cmp.length>=3&&Math.random()<.4?3:2,5,2,4)||bogiOne(g,'x',5,2,4);
  return bogiOne(g,'x',5,2,4);
}
const GEN={c:genC,h:genH,m:genM,s:genS,x:genX};

/* ============ 세트 만들기 ============ */
const LV = {c:{n:'개념 확인',d:'개념 하나씩 빠르게',dot:0},h:{n:'하',d:'기본 문장 옳고 그름',dot:1},m:{n:'중',d:'제시문 읽고 누구·무엇인지 파악',dot:2},s:{n:'상',d:'두 입장 비교, ㄱㄴㄷㄹ 보기형',dot:3},x:{n:'최상',d:'세 입장 비교, 5개 보기, 함정·사례 적용',dot:4}};
function normHW(q){
  const ord=q.f?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));
  return {sig:q.id,lv:q.lv,ch:q.ch,p:q.p||'',q:q.q,b:q.b||null,o:ord.map(i=>q.o[i]),a:ord.indexOf(q.a),e:q.e};
}
function buildSet(ch,lv,n){
  const hw=shuffle(Q.filter(q=>q.lv===lv&&(!ch||q.ch===ch))).map(normHW);
  const gs=G.filter(g=>!ch||g.ch===ch);
  const out=hw.slice(0,Math.ceil(n*.35)), seen=new Set(out.map(x=>x.sig));
  let tries=0;
  while(out.length<n&&tries<n*30){
    tries++;
    const q=GEN[lv](rnd(gs)); if(!q) continue;
    q.sig='g:'+q.q+(q.p||'')+(q.b||q.o).join('|');
    if(seen.has(q.sig)) continue; seen.add(q.sig); out.push(q);
  }
  for(const h of hw){ if(out.length>=n) break; if(!seen.has(h.sig)){seen.add(h.sig);out.push(h)} }
  return shuffle(out);
}

/* ============ 상태 ============ */
let st = {tab:'concept', blank:false, cc:0, ch:0, lv:'c', n:20, quiz:null};
const store = {
  get(){try{return JSON.parse(localStorage.getItem('ts2-wrong2')||'[]')}catch(e){return []}},
  set(v){try{localStorage.setItem('ts2-wrong2',JSON.stringify(v.slice(-300)))}catch(e){}}
};
const app = document.getElementById('app');

/* ============ 렌더 ============ */
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===st.tab));
  const bb=document.getElementById('blankBtn');
  bb.hidden = st.tab!=='concept';
  bb.classList.toggle('on',st.blank);
  bb.textContent = st.blank?'빈칸 모드 켜짐':'빈칸 모드';
  if(st.tab==='concept') renderConcept();
  else if(st.tab==='quiz') st.quiz ? (st.quiz.done?renderResult():renderQ()) : renderSetup();
  else renderWrong();
}
function chRow(cur,attr,withAll){
  let h='<div class="chrow">';
  if(withAll) h+=`<button class="chip${cur===0?' on':''}" data-${attr}="0">전체</button>`;
  CH.forEach((t,i)=>{const v=withAll?i+1:i;h+=`<button class="chip${cur===v?' on':''}" data-${attr}="${v}">${i+1}. ${t}</button>`});
  return h+'</div>';
}
function renderConcept(){
  app.className='wrap'+(st.blank?' blank':'');
  const s=SECTIONS[st.cc];
  let h=chRow(st.cc,'cc',false);
  if(st.blank) h+='<p class="blankinfo">형광펜 친 핵심어가 가려졌어요. 빈칸을 누르면 답이 보여요.</p>';
  h+=`<section class="sec open"><div class="chhead"><span class="no">${st.cc+1}</span><span class="tt"><b>${s.t}</b><span>${s.s}</span></span></div><div class="body">${s.h}</div></section>`;
  h+=`<div class="row" style="margin-bottom:10px">${st.cc>0?`<button class="go ghost" data-act="prevch">이전 챕터</button>`:''}<button class="go" data-act="chquiz">${st.cc+1}챕터 문제 풀기</button>${st.cc<4?`<button class="go ghost" data-act="nextch">다음 챕터</button>`:''}</div>`;
  app.innerHTML=h;
}
function renderSetup(){
  app.className='wrap';
  const hw=k=>Q.filter(q=>q.lv===k&&(!st.ch||q.ch===st.ch)).length;
  let h=`<div class="card"><h2>챕터</h2>${chRow(st.ch,'ch',true)}
  <h2 style="margin-top:18px">난이도</h2><p class="muted">직접 출제한 문제에 개념 은행에서 자동으로 조합한 문제가 섞여 나와요. 풀 때마다 새 문제가 만들어져요.</p><div class="lvgrid">`;
  Object.keys(LV).forEach(k=>{
    const L=LV[k], dots=k==='c'?'':`<span class="dots">${[1,2,3,4].map(i=>`<i class="${i<=L.dot?'f':''}"></i>`).join('')}</span>`;
    h+=`<button class="lv${k==='c'?' wide':''}${st.lv===k?' on':''}" data-lv="${k}"><b>${L.n}${dots}</b><span>${L.d}<br>직접 출제 ${hw(k)} + 자동 조합 무제한</span></button>`;
  });
  h+=`</div><h2 style="margin-top:20px">문제 수</h2><div class="chips">`;
  [10,20,30,50].forEach(n=>{h+=`<button class="chip${st.n===n?' on':''}" data-n="${n}">${n}문제</button>`});
  h+=`</div><button class="go" data-act="start">풀기 시작</button></div>`;
  app.innerHTML=h;
}
function startQuiz(items,label){
  st.quiz={items,i:0,picked:null,right:0,wrong:[],label,done:false};
  render(); window.scrollTo(0,0);
}
function renderQ(){
  app.className='wrap';
  const z=st.quiz, q=z.items[z.i];
  let h=`<div class="qhead"><span><span class="tag">${q.ch}챕터</span><span class="tag">${LV[q.lv].n}</span></span><span>${z.i+1} / ${z.items.length}</span></div><div class="bar"><i style="width:${z.i/z.items.length*100}%"></i></div><div class="card">`;
  if(q.p) h+=`<div class="psg">${q.p}</div>`;
  h+=`<div class="stem">${q.q}</div>`;
  if(q.b) h+=`<div class="bogi">${q.b.map((s,i)=>`<div><b>${BG[i]}.</b><span>${s}</span></div>`).join('')}</div>`;
  q.o.forEach((o,i)=>{
    let cls='opt'; if(z.picked!==null){ if(i===q.a) cls+=' right'; else if(i===z.picked) cls+=' wrong'; }
    h+=`<button class="${cls}" data-pick="${i}" ${z.picked!==null?'disabled':''}><span class="n">${NUM[i]}</span><span>${o}</span></button>`;
  });
  if(z.picked!==null){
    const ok=z.picked===q.a;
    h+=`<div class="exp"><div class="res ${ok?'o':'x'}">${ok?'정답!':'오답 · 정답은 '+NUM[q.a]}</div>${q.e}</div><button class="go" data-act="next">${z.i+1<z.items.length?'다음 문제':'결과 보기'}</button>`;
  }
  app.innerHTML=h+'</div>';
}
function pick(i){
  const z=st.quiz; if(z.picked!==null) return;
  z.picked=i; const q=z.items[z.i]; let w=store.get();
  if(i===q.a){ z.right++; w=w.filter(x=>x.sig!==q.sig); }
  else { z.wrong.push(q); if(!w.some(x=>x.sig===q.sig)) w.push(q); }
  store.set(w); renderQ();
  const ex=app.querySelector('.exp'); if(ex) ex.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function renderResult(){
  app.className='wrap';
  const z=st.quiz, tot=z.items.length, pct=Math.round(z.right/tot*100);
  const msg=pct===100?'전부 맞혔어요. 한 단계 위 난이도에 도전해 보세요.':pct>=80?'거의 다 잡았어요. 틀린 문제만 다시 확인해요.':pct>=50?'절반 넘게 맞혔어요. 해설을 보고 개념 정리에서 다시 짚어 보세요.':'개념 정리를 빈칸 모드로 한 번 더 보고 다시 풀어 보세요.';
  let h=`<div class="card"><p class="muted">${z.label}</p><div class="score">${z.right} / ${tot}</div><p>${msg}</p>`;
  if(z.wrong.length){ h+=`<h2 style="margin-top:16px">틀린 문제</h2>`; z.wrong.forEach(q=>{h+=wrongItem(q)}); }
  h+=`<div class="row"><button class="go ghost" data-act="setup">조건 다시 고르기</button><button class="go" data-act="retry">새 문제로 다시</button></div></div>`;
  app.innerHTML=h;
}
function wrongItem(q){
  return `<div class="wl"><span class="tag">${q.ch}챕터</span><span class="tag">${LV[q.lv].n}</span><div>${q.q}</div>${q.b?`<div class="muted">${q.b.map((s,i)=>BG[i]+'. '+s).join('<br>')}</div>`:''}<div class="a">정답: ${NUM[q.a]} ${q.o[q.a]}</div><div class="muted">${q.e}</div></div>`;
}
function renderWrong(){
  app.className='wrap';
  const list=store.get();
  if(!list.length){ app.innerHTML=`<div class="card empty"><h2>오답 노트가 비어 있어요</h2><p>문제를 풀다 틀린 문제가 여기에 모여요. 다시 풀어서 맞히면 자동으로 빠져요.</p><button class="go" data-act="toquiz">문제 풀러 가기</button></div>`; return; }
  let h=`<div class="card"><h2>틀린 문제 ${list.length}개</h2><p class="muted">맞힐 때까지 여기에 남아 있어요.</p><button class="go" data-act="wrongquiz">오답만 다시 풀기</button>`;
  list.slice().reverse().forEach(q=>{h+=wrongItem(q)});
  h+=`<button class="go ghost" data-act="clear">오답 노트 비우기</button></div>`;
  app.innerHTML=h;
}

/* ============ 이벤트 ============ */
document.querySelector('nav.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  st.tab=b.dataset.tab; render(); window.scrollTo(0,0);
});
document.getElementById('blankBtn').addEventListener('click',()=>{st.blank=!st.blank;render()});
app.addEventListener('click',e=>{
  const k=e.target.closest('.k'); if(k&&st.blank){k.classList.toggle('show');return}
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.cc!==undefined){st.cc=+b.dataset.cc;render();window.scrollTo(0,0);return}
  if(b.dataset.ch!==undefined){st.ch=+b.dataset.ch;renderSetup();return}
  if(b.dataset.lv){st.lv=b.dataset.lv;renderSetup();return}
  if(b.dataset.n!==undefined){st.n=+b.dataset.n;renderSetup();return}
  if(b.dataset.pick!==undefined){pick(+b.dataset.pick);return}
  const a=b.dataset.act;
  if(a==='prevch'){st.cc--;render();window.scrollTo(0,0)}
  if(a==='nextch'){st.cc++;render();window.scrollTo(0,0)}
  if(a==='chquiz'){st.tab='quiz';st.ch=st.cc+1;st.quiz=null;render();window.scrollTo(0,0)}
  if(a==='start'||a==='retry'){startQuiz(buildSet(st.ch,st.lv,st.n),(st.ch?st.ch+'챕터 · ':'전체 · ')+LV[st.lv].n)}
  if(a==='next'){const z=st.quiz;z.i++;z.picked=null;if(z.i>=z.items.length)z.done=true;render();window.scrollTo(0,0)}
  if(a==='setup'){st.quiz=null;render()}
  if(a==='toquiz'){st.tab='quiz';st.quiz=null;render()}
  if(a==='wrongquiz'){st.tab='quiz';startQuiz(shuffle(store.get()),'오답 다시 풀기')}
  if(a==='clear'){if(confirm('오답 노트를 비울까요?')){store.set([]);render()}}
});
render();

</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
